[package]
name = "sportscout"
version = "0.11.0"
description = "SportsScout Match Scouting & Video Analysis Workstation"
authors = ["SportsScout Team"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "sportscout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
