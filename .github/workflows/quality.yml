name: Quality

on:
  push:
    branches: [main, refactor/*, feat/*, fix/*]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai_service/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_service/requirements.txt

      - name: Run Python unit and contract checks
        run: |
          python -m unittest discover -s ai_service/tests -p "test_*.py"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Validate PWA icons
        run: npm run check-icons

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run browser acceptance
        run: npm run test:e2e
